name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Verify sqlc generated code is up to date
        run: |
          sqlc generate
          if ! git diff --quiet --exit-code internal/db/sqlc; then
            echo "sqlc generated code is out of date. Run 'make sqlc'."
            git diff internal/db/sqlc
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -timeout=120s ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.0.2
          args: --timeout=5m
