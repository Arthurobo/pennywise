{{define "title"}}Sign in — Pennywise{{end}}

{{define "content"}}
<div class="auth-shell">
  <div class="auth-form">
    <div class="flex flex-col items-center text-center mb-2">
      {{ template "brand_mark" . }}
      <h1 class="mt-5 text-2xl font-semibold tracking-tight">Sign in</h1>
      <p class="mt-1.5 text-sm text-zinc-500 dark:text-zinc-400">
        Welcome back to Pennywise.
      </p>
    </div>

    {{ if .Error }}
      <div class="alert-error">{{ .Error }}</div>
    {{ end }}

    <form action="/login" method="post" class="space-y-4">
      <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">
      <input type="hidden" name="next"  value="{{ .Next }}">

      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autofocus
               value="{{ .Email }}" placeholder="you@example.com">
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required
               placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary w-full">Sign in</button>
    </form>
  </div>
</div>
{{end}}
